name: tests

on: 
  push:
      branches:
          - master
          - main

jobs:
  tests:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            php: '8.1'
            phpunit: '10.5'
          - os: ubuntu-latest
            php: '8.4'
            phpunit: '11.5'
          - os: ubuntu-latest
            php: '8.5'
            phpunit: '11.5'

    name: PHP ${{ matrix.php }} on ${{ matrix.os }}

    steps:
      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # PHP Extras
          coverage: none
          tools: composer
          #ini-values: "memory_limit=512M"
          extensions: gd

      - name: Checkout codes
        uses: "actions/checkout@v4"

      #- name: Composer
      #  uses: php-actions/composer@v6
      #  with:
      #    php_version: ${{ matrix.php }}

      - name: Composer
        run: |
          composer update
          composer require phpunit/phpunit:"${{ matrix.phpunit }}.*" --dev

      #- name: PHPUnit Tests
      #  uses: php-actions/phpunit@v3
      #  with:
      #    configuration: tests/phpunit.xml
      #    version: ${{ matrix.phpunit }}
      #    php_version: ${{ matrix.php }}
      #    filter: ReleaseTest

      - name: PHPUnit Tests
        run: |
          PLOT_RENDERER_SKIP=true;
          export PLOT_RENDERER_SKIP;
          phpunit -c tests

